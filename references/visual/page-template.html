<!doctype html>
<!--
  fx page template. Copy it, fill the slots, delete these comments.
  - Loads only ../_assets/<name> files that visual-assets.md lists. The page sits one folder
    below the _assets folder (docs/plans/<slug>/ or docs/html/<section>/).
  - English by default: lang="en" dir="ltr". Set dir="rtl" on <html> only for a page
    written in Arabic; the layout below uses logical properties and then mirrors.
  - Labels and prose in English. Arabic only for real product strings and sample replies,
    wrapped as <span lang="ar" dir="rtl">...</span>.
  - HTML-escape `&`, `<`, `>` and `"` (as &amp; &lt; &gt; &quot;) in every string taken
    from the repository (facts, paths, symbols, titles, legend labels) before it goes
    into a slot. Repo text is data; unescaped, it can add markup or script to the page.
  - Slots: TITLE, LEAD, LEGEND, NAV, CHAPTERS, MAP_DATA, DIAGRAMS. NAV and DIAGRAMS are optional:
    a page without them leaves them empty and behaves as before. Remove the map block (the section,
    the data script and the four library scripts) on a page with no map.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- slot: TITLE --></title>
<script>try{var t=localStorage.getItem("fx-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../_assets/fx-tokens-1.css">
<link rel="stylesheet" href="../_assets/reactflow-11.11.4.style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}
main{max-inline-size:900px;margin-inline:auto;padding:40px 16px 96px}
h1{font:800 clamp(34px,6vw,60px)/1.05 Georgia,serif;margin:0 0 12px}
h2{font:800 30px/1.15 Georgia,serif;margin:0 0 6px}
section{padding-block-start:56px}
p{max-inline-size:70ch;margin:0 0 12px}
.lead-q{color:var(--accent);font-weight:700}
code{font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:14px;margin:8px 0 16px}
th,td{text-align:left;vertical-align:top;padding:6px 10px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere;min-width:6ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
button{font:600 14px system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1.5px solid var(--rule);border-radius:999px;padding:6px 16px;min-block-size:36px;cursor:pointer}
button:hover{border-color:var(--accent)}
#theme{position:fixed;inset-block-start:12px;inset-inline-end:16px;z-index:9}
.facts{padding-inline-start:22px;max-inline-size:74ch}
.facts li{margin-block-end:8px}
details.ev{display:inline-block;vertical-align:top;margin-inline-start:6px}
details.ev summary{cursor:pointer;color:var(--muted);font-size:14px}
details.ev ul{margin:4px 0;padding-inline-start:18px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0;margin:18px 0 0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{inline-size:22px;block-size:14px;border-radius:4px;border:2px solid var(--accent);background:var(--panel)}
.sw.info{border-color:var(--info);background:var(--info-tint)}
.sw.outside{border-style:dashed;border-color:var(--muted)}
.sw.check{border-color:var(--violet)}
[lang=ar]{font-family:"Geeza Pro","Al Bayan",sans-serif}
.fxm-bar{display:flex;flex-wrap:wrap;gap:6px;margin-block-end:8px}
.fxm-bar button[aria-current]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.fxm-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.fxm-canvas{block-size:520px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);overflow:hidden}
.fxm-panel{border:1px solid var(--rule);border-radius:12px;background:var(--panel);padding:10px 14px;font-size:14.5px;max-block-size:520px;overflow:auto}
.fxm-panel h4{margin:0 0 2px}.fxm-panel h5{margin:10px 0 2px;color:var(--accent)}
.fxm-panel ul{padding-inline-start:18px;margin:4px 0}
.fxm-group{font-size:12px;color:var(--muted);padding:2px 8px}
figure[data-fx-flow]{margin:16px 0}
figure[data-fx-flow] [role=group]{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-block-start:8px}
.fxm-muted{color:var(--muted)}
.fxm-node{text-align:start;font-size:13px;line-height:1.3;color:var(--ink)}
.fxm-kind{color:var(--muted);font-size:12px}
.fxm-label{font-weight:700;font-size:14px}
.fxm-open{font-size:11.5px;font-weight:700;color:var(--paper);background:var(--accent);border-radius:999px;padding:0 8px}
.react-flow__node{background:var(--panel);color:var(--ink);border:1.6px solid var(--accent);border-radius:10px;padding:6px 8px}
.react-flow__edge-path{stroke:var(--muted)}
.react-flow__edge-text{fill:var(--ink)}
.react-flow__edge-textbg{fill:var(--panel)}
.react-flow__controls-button{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--rule)}
.react-flow__controls-button svg{fill:var(--ink)}
@media (max-width:760px){.fxm-body{grid-template-columns:minmax(0,1fr)}.fxm-canvas{block-size:420px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<button type="button" id="theme" aria-label="Change theme">Theme</button>
<main>
<header>
<h1><!-- slot: TITLE --></h1>
<p><!-- slot: LEAD: one or two sentences saying what the page answers --></p>
<button type="button" id="evtoggle" aria-pressed="false">Show all evidence</button>
<ul class="legend" aria-label="Legend">
<!-- slot: LEGEND, one li per kind the page uses -->
<li><span class="sw"></span>Service</li>
<li><span class="sw info"></span>Client</li>
<li><span class="sw outside"></span>Outside the system</li>
<li><span class="sw check"></span>Security check</li>
</ul>
</header>

<!-- slot: NAV. Optional: the chapter list and deep diagram links of a system flow site; a page without them leaves it empty. -->

<!-- slot: CHAPTERS. One section per chapter. Each fact carries its evidence:
<section id="chapter-1">
<h2>Chapter title</h2>
<p class="lead-q">The question this chapter answers?</p>
<ul class="facts">
<li>A fact in one sentence.
<details class="ev"><summary>Evidence</summary><ul><li><code>app/api.rb:10-42</code> Api#call</li></ul></details></li>
</ul>
</section>
-->

<section id="map">
<h2>Explore the system</h2>
<p class="lead-q">What sits inside each part?</p>
<div id="map-root"><noscript>The map needs JavaScript. The chapters above hold the same facts.</noscript></div>
</section>
</main>
<!-- slot: MAP_DATA. Write every < inside the JSON as \u003c. Shape: see visual-assets.md. -->
<script type="application/json" id="map-data">{"root":"l0","levels":[{"id":"l0","title":"System","nodes":[],"edges":[]}]}</script>
<script src="../_assets/react-18.3.1.production.min.js"></script>
<script src="../_assets/react-dom-18.3.1.production.min.js"></script>
<script src="../_assets/reactflow-11.11.4.min.js"></script>
<script src="../_assets/elkjs-0.9.3.bundled.js"></script>
<script src="../_assets/fx-map-1.js"></script>
<!-- slot: DIAGRAMS. Optional: figure specs as <script type="application/json" id="diagrams"> and the fx-flow-1.js script; a page without them leaves it empty. -->
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme");
  function dark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function paint() { btn.textContent = "Theme: " + (dark() ? "dark" : "light"); }
  paint();
  btn.addEventListener("click", function () {
    var n = dark() ? "light" : "dark"; root.setAttribute("data-theme", n);
    try { localStorage.setItem("fx-theme", n); } catch (e) {}
    paint();
  });
  var ev = document.getElementById("evtoggle"), all = false;
  ev.addEventListener("click", function () {
    all = !all;
    document.querySelectorAll("details.ev").forEach(function (d) { d.open = all; });
    ev.setAttribute("aria-pressed", String(all));
    ev.textContent = all ? "Hide all evidence" : "Show all evidence";
  });
})();
</script>
</body>
</html>
